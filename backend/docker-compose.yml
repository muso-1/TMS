version: '3.9'
services:
  postgres:
    image: postgres:16
    container_name: tenant_pg
    environment:
      POSTGRES_USER: tenant_user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: tenant_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: